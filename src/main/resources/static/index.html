<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Monitoramento de Canteiros</title>
    <style>
        body { font-family: sans-serif; margin: 30px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input, select, button { padding: 8px; width: 300px; box-sizing: border-box; }
        button { cursor: pointer; background: #2e7d32; color: white; border: none; font-weight: bold; margin-top: 10px; }
        table { border-collapse: collapse; width: 100%; margin-top: 30px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f4f4f4; }
        .alerta { color: #d32f2f; font-weight: bold; }
        .ok { color: #2e7d32; font-weight: bold; }
    </style>
</head>
<body>

<h1>Cadastro e Monitoramento de Canteiros</h1>

<div class="form-group">
    <label>Nome do Canteiro:</label>
    <input type="text" id="nome" placeholder="Ex: Canteiro Alface A">
</div>

<div class="form-group">
    <label>Largura (m):</label>
    <input type="number" step="0.1" id="largura">
</div>

<div class="form-group">
    <label>Comprimento (m):</label>
    <input type="number" step="0.1" id="comprimento">
</div>

<div class="form-group">
    <label>Humidade Atual (%):</label>
    <input type="number" id="umidade">
</div>

<div class="form-group">
    <label>Tipo de Cultura:</label>
    <select id="tipoCultura">
        <option value="HORTALICA">Hortaliça (regra: < 60%)</option>
        <option value="TUBERCULO">Tubérculo (regra: < 40%)</option>
        <option value="GRAO">Grão (regra: < 50%)</option>
    </select>
</div>

<button onclick="cadastrarCanteiro()">Cadastrar Canteiro</button>

<h2>Canteiros Cadastrados</h2>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Dimensões (m)</th>
        <th>Área Total</th>
        <th>Cultura</th>
        <th>Humidade</th>
        <th>Status de Irrigação</th>
    </tr>
    </thead>
    <tbody id="tabela-corpo"></tbody>
</table>

<script>
    const API_URL = "/canteiro";

    async function carregarCanteiros() {
        try {
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error("Erro ao buscar registros");
            const lista = await res.json();

            const tbody = document.getElementById("tabela-corpo");
            tbody.innerHTML = "";

            lista.forEach(c => {
                const statusHtml = c.precisaIrrigar
                    ? `<span class="alerta">Irrigação Necessária</span>`
                    : `<span class="ok">Humidade Adequada</span>`;

                tbody.innerHTML += `
                        <tr>
                            <td>${c.id}</td>
                            <td>${c.nome}</td>
                            <td>${c.larguraMetros} x ${c.comprimentoMetros}</td>
                            <td>${c.areaTotal.toFixed(2)} m²</td>
                            <td>${c.tipoCultura}</td>
                            <td>${c.umidadeAtualPercentual}%</td>
                            <td>${statusHtml}</td>
                        </tr>
                    `;
            });
        } catch (err) {
            console.error(err);
        }
    }

    async function cadastrarCanteiro() {
        const payload = {
            nome: document.getElementById("nome").value,
            larguraMetros: parseFloat(document.getElementById("largura").value),
            comprimentoMetros: parseFloat(document.getElementById("comprimento").value),
            umidadeAtualPercentual: parseInt(document.getElementById("umidade").value),
            tipoCultura: document.getElementById("tipoCultura").value
        };

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                document.getElementById("nome").value = "";
                document.getElementById("largura").value = "";
                document.getElementById("comprimento").value = "";
                document.getElementById("umidade").value = "";
                await carregarCanteiros();
            } else {
                const erro = await res.json();
                alert("Falha na validação dos dados!");
                console.error(erro);
            }
        } catch (err) {
            alert("Erro ao conectar com a API.");
            console.error(err);
        }
    }

    // Carrega os canteiros cadastrados ao abrir a página
    carregarCanteiros();
</script>
</body>
</html>
